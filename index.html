<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファミ旅リンク - グループ旅行しおり＆精算</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d9488">
    
    <!-- PWAマニフェスト動的生成 -->
    <script>
        const manifest = {
            "name": "ファミ旅リンク",
            "short_name": "ファミ旅",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#0d9488",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/3177/3177440.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="app" class="max-w-md mx-auto pb-24">
        <!-- ヘッダー -->
        <header class="bg-teal-700 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
            <h1 class="font-bold text-lg"><i class="fa-solid fa-plane-departure mr-2"></i>ファミ旅リンク</h1>
            <div class="text-xs bg-teal-800 px-2 py-1 rounded">グループ旅行管理</div>
        </header>

        <!-- メインコンテンツ -->
        <main class="p-4 space-y-6">
            <!-- タイムラインタブ -->
            <div id="tab-timeline" class="tab-content space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg text-slate-700">旅行のしおり</h2>
                    <button onclick="openModal('schedule')" class="bg-teal-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i>予定追加</button>
                </div>
                <div id="schedule-list" class="space-y-3"></div>
            </div>

            <!-- 投票タブ -->
            <div id="tab-votes" class="tab-content space-y-4" style="display: none;">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg text-slate-700">みんなの希望・やりたいこと</h2>
                    <button onclick="openModal('vote')" class="bg-teal-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i>希望を追加</button>
                </div>
                <div id="vote-list" class="space-y-3"></div>
            </div>

            <!-- 精算タブ -->
            <div id="tab-money" class="tab-content space-y-4" style="display: none;">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg text-slate-700">立て替え・精算管理</h2>
                    <button onclick="openModal('expense')" class="bg-teal-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i>支出を記録</button>
                </div>
                <div id="expense-list" class="space-y-3"></div>
            </div>

            <!-- 設定タブ -->
            <div id="tab-settings" class="tab-content space-y-4" style="display: none;">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                    <h2 class="font-bold text-teal-800"><i class="fa-solid fa-gear mr-2"></i>旅行・家族の設定</h2>
                    <div>
                        <label class="block text-sm text-slate-600 mb-1">旅行タイトル</label>
                        <input id="trip-title" type="text" oninput="saveSettings()" class="w-full p-2 border rounded text-sm" placeholder="例：夏休み家族旅行">
                    </div>
                    <h3 class="font-bold text-sm text-slate-700 pt-2">参加家族一覧</h3>
                    <div id="family-list" class="space-y-2"></div>
                    <button onclick="addFamily()" class="w-full bg-slate-100
