<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ファミ旅リンク</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d9488">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #f1f5f9; color: #1e293b; padding-bottom: 85px; }
  header { background: #0f766e; color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  header h1 { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65%; }
  main { padding: 16px; max-width: 500px; margin: 0 auto; }
  
  .project-bar { background: #fff; border-bottom: 1px solid #cbd5e1; padding: 10px 16px; display: flex; gap: 8px; align-items: center; overflow-x: auto; }
  .project-select { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; font-weight: bold; color: #0f766e; }

  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 6px; }
  .header-row h2 { font-size: 17px; color: #0f172a; font-weight: 700; flex: 1; }
  .btn-primary { background: #0d9488; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1); white-space: nowrap; }
  .btn-primary:active { opacity: 0.85; }
  .btn-sub { background: #e2e8f0; color: #334155; border: none; padding: 8px 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .btn-sub:active { opacity: 0.85; }
  
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .empty-card { text-align: center; padding: 32px 16px; border: 2px dashed #cbd5e1; color: #64748b; border-radius: 12px; background: #fff; font-size: 13px; }
  
  .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
  .icon-btn { background: #f1f5f9; border: none; padding: 5px 8px; border-radius: 6px; font-size: 12px; color: #475569; cursor: pointer; font-weight: 600; }
  .icon-btn.del { color: #ef4444; background: #fef2f2; }

  .day-section { margin-bottom: 20px; }
  .day-header { background: #0f766e; color: #fff; display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
  .timeline-container { border-left: 3px solid #99f6e4; margin-left: 10px; padding-left: 16px; }
  .sch-time { font-size: 12px; font-weight: 700; color: #0f766e; margin-bottom: 2px; }
  .sch-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; padding-right: 85px; }
  .sch-meta { font-size: 12px; color: #475569; margin-bottom: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sch-detail { font-size: 12px; color: #64748b; background: #f8fafc; padding: 6px 8px; border-radius: 6px; margin-top: 4px; white-space: pre-wrap; border-left: 2px solid #cbd5e1; }

  label.field-label { display: block; font-size: 11px; font-weight: bold; color: #475569; margin-bottom: 3px; }
  input, select, textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 10px; background: #fff; color: #1e293b; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #0d9488; }
  
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 8px 0 10px; z-index: 20; box-shadow: 0 -2px 6px rgba(0,0,0,0.04); }
  nav button { background: none; border: none; color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; width: 20%; }
  nav button.active { color: #0d9488; font-weight: bold; }
  nav button span.icon { font-size: 16px; }
  
  .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 50; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .modal.open { display: flex; }
  .modal-box { background: #fff; width: 100%; max-width: 380px; border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin: auto; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { margin-bottom: 12px; font-size: 16px; color: #0f172a; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
  .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; }
  .btn-cancel { background: #f1f5f9; color: #475569; }
  .divider { border-top: 1px solid #e2e8f0; margin: 14px 0; }
  .split-toggle { display: flex; background: #e2e8f0; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
  .split-toggle button { flex: 1; border: none; background: transparent; padding: 6px; font-size: 12px; font-weight: bold; color: #475569; border-radius: 6px; cursor: pointer; }
  .split-toggle button.active { background: #fff; color: #0f766e; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<header>
  <h1 id="header-project-title">✈️ ファミ旅リンク</h1>
  <button type="button" onclick="openProjectModal()" style="background:#115e59; color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer; white-space:nowrap;">旅行管理・共有</button>
</header>

<div class="project-bar">
  <span style="font-size:12px; font-weight:bold; color:#475569; white-space:nowrap;">現在の旅行:</span>
  <select id="project-dropdown" class="project-select" onchange="switchProject(this.value)"></select>
</div>

<main>
  <!-- 1. タイムライン（しおり） -->
  <div id="tab-timeline" class="tab-view">
    <div class="header-row">
      <h2>📅 旅のしおり</h2>
      <button type="button" class="btn-sub" onclick="copyScheduleText()">📋 LINE共有</button>
      <button type="button" class="btn-primary" onclick="openScheduleModal(-1)">＋ 予定追加</button>
    </div>
    <div id="schedule-list"></div>
  </div>

  <!-- 2. 参加家族 -->
  <div id="tab-families" class="tab-view" style="display:none;">
    <div class="header-row">
      <h2>👨‍👩‍👧‍👦 参加家族</h2>
      <button type="button" class="btn-primary" onclick="openFamilyModal(-1)">＋ 家族追加</button>
    </div>
    <div id="family-list"></div>
  </div>

  <!-- 3. 持ち物 -->
  <div id="tab-items" class="tab-view" style="display:none;">
    <div class="header-row">
      <h2>🎒 持ち物リスト</h2>
      <button type="button" class="btn-primary" onclick="openItemModal(-1)">＋ 持ち物追加</button>
    </div>
    <div id="item-list"></div>
  </div>

  <!-- 4. 役割分担 -->
  <div id="tab-tasks" class="tab-view" style="display:none;">
    <div class="header-row">
      <h2>📝 役割分担</h2>
      <button type="button" class="btn-primary" onclick="openTaskModal(-1)">＋ 分担追加</button>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- 5. 精算 -->
  <div id="tab-money" class="tab-view" style="display:none;">
    <div class="header-row">
      <h2>💴 立て替え・精算</h2>
      <button type="button" class="btn-sub" onclick="copyExpenseText()">📋 精算共有</button>
      <button type="button" class="btn-primary" onclick="openExpenseModal()">＋ 支出記録</button>
    </div>
    <div class="split-toggle">
      <button type="button" id="mode-adult" class="active" onclick="setSplitMode('adult')">大人人数で傾斜割り</button>
      <button type="button" id="mode-family" onclick="setSplitMode('family')">家族数で均等割り</button>
    </div>
    <div id="expense-summary"></div>
    <div id="expense-list"></div>
  </div>
</main>

<nav>
  <button type="button" id="nav-timeline" class="active" onclick="switchTab('timeline')"><span class="icon">📅</span>しおり</button>
  <button type="button" id="nav-families" onclick="switchTab('families')"><span class="icon">👨‍👩‍👧‍👦</span>家族</button>
  <button type="button" id="nav-items" onclick="switchTab('items')"><span class="icon">🎒</span>持ち物</button>
  <button type="button" id="nav-tasks" onclick="switchTab('tasks')"><span class="icon">📝</span>分担</button>
  <button type="button" id="nav-money" onclick="switchTab('money')"><span class="icon">💴</span>精算</button>
</nav>

<!-- 旅行プロジェクト管理・データ共有モーダル -->
<div id="modal-project" class="modal">
  <div class="modal-box">
    <h3>旅行プロジェクトの管理・共有</h3>
    <label class="field-label">新しい旅行を作成</label>
    <input type="text" id="new-proj-name" placeholder="例: 冬の温泉旅行">
    <button type="button" class="btn-primary" style="width:100%; margin-bottom:10px;" onclick="createProject()">＋ 新しい旅行を作成して切替</button>

    <div class="divider"></div>
    <label class="field-label">他の家族へデータを送る（引き継ぎコード）</label>
    <button type="button" class="btn-sub" style="width:100%; margin-bottom:10px; padding:10px;" onclick="exportProjectCode()">📤 現在の旅行データをコピーする</button>

    <label class="field-label">送られてきたデータを取り込む</label>
    <textarea id="import-code-input" rows="2" placeholder="ここに共有コードを貼り付け"></textarea>
    <button type="button" class="btn-sub" style="width:100%; margin-bottom:10px; padding:10px;" onclick="importProjectCode()">📥 コードから旅行データを取り込む</button>

    <div class="divider"></div>
    <button type="button" class="icon-btn del" style="width:100%; padding:10px; margin-bottom:10px;" onclick="deleteCurrentProject()">🗑️ 現在の旅行データを削除</button>
    <div class="modal-btns"><button type="button" class="btn-cancel" style="width:100%;" onclick="closeModal('modal-project')">閉じる</button></div>
  </div>
</div>

<!-- しおりモーダル -->
<div id="modal-schedule" class="modal">
  <div class="modal-box">
    <h3 id="sch-modal-heading">予定の追加</h3>
